# Netlify configuration for building and hosting the pyCSAMT documentation
# (https://pycsamt.org): Python 3.12, `pip install .[docs,geo]`, Sphinx HTML
# written to docs/build/html.
#
# Netlify's default build timeout is 15 minutes too — what makes it viable
# here is the cache plugin at the bottom: docs/build (Sphinx environment,
# doctrees, written html) and docs/source/examples (executed sphinx-gallery
# output) persist between deploys, so a push only re-executes the example
# scripts whose .py actually changed and only rewrites affected pages.
# Only the first, cold build runs everything; if that one hits the timeout,
# deploy once with `-D plot_gallery=0` appended to the sphinx command (or ask
# Netlify support to raise the site's timeout), then restore this command.
#
# Release-gated builds: pycsamt.org previously rebuilt on every commit to
# master, which burns a production-deploy credit each time and is what
# exhausted the team's free-plan allowance and suspended the site (see
# HOW-TO-USE-NETLIGY-FOR-OPEN-SOURCE.md, kept local-only, never committed).
# Two layers now stop that:
#   1. The GitHub App's push-triggered builds for `master` must be disabled
#      in the Netlify UI (Site configuration -> Build & deploy -> Stop
#      builds), so ordinary commits never even start a build. This is a
#      dashboard setting, not something netlify.toml can express.
#   2. Production deploys instead come from .github/workflows/netlify-
#      release-deploy.yml, which POSTs to a Netlify Build Hook only when a
#      `v*` tag is pushed (i.e. on release).
# The `ignore` command below is a second line of defense in case build
# triggers are ever re-enabled or a build starts by some other path: it
# skips the deploy unless HEAD is exactly a `v*` release tag.

[build]
  publish = "docs/build/html"
  # CPU-only torch first: the ai_inversion gallery examples need a DL
  # backend, and the default PyPI torch drags in multi-GB CUDA wheels the
  # build image cannot afford. The cpu index wheel is ~190 MB.
  command = "python -m pip install torch --index-url https://download.pytorch.org/whl/cpu && python -m pip install .[docs,geo] && python -m sphinx -b html -j auto docs/source docs/build/html"

  # Build only for release tags. Netlify's clone can be shallow enough to
  # miss tag refs, so fetch them explicitly first; `git describe` then
  # succeeds (exit 0) only when HEAD is exactly tagged `vX.Y.Z...`. Negate
  # it so the overall exit code carries Netlify's expected meaning (0 =
  # skip, non-zero = proceed).
  ignore = "git fetch --tags --quiet 2>/dev/null; ! git describe --tags --exact-match --match 'v*' HEAD >/dev/null 2>&1"

[build.environment]
  # Python runtime on Netlify's build image. Newer (mise-based) images read
  # the .python-version file at the repo root instead; keep both in sync.
  PYTHON_VERSION = "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK = "1"

# Persists the listed directories in Netlify's build cache. The plugin is a
# community package, so it must be declared in package.json (repo root) for
# Netlify's npm step to install it — netlify.toml alone is not enough.
# Trade-off: html removed from the source tree lingers in the cached output
# until a "Clear cache and deploy" — same as any incremental Sphinx build.
[[plugins]]
  package = "netlify-plugin-cache"

  [plugins.inputs]
    paths = [
      "docs/build",           # doctrees + environment pickle + written html
      "docs/source/examples", # gallery output: unchanged examples are not re-run
    ]
