name: Deploy docs to Netlify on release

# pycsamt.org previously rebuilt on every push to master via Netlify's
# GitHub App integration, which spends a production-deploy credit per
# commit and exhausted the team's free-plan allowance.
#
# Deploys are now release-only, enforced structurally rather than by a
# dashboard toggle: Netlify's production branch is `docs-deploy`, a
# bot-only pointer branch nobody commits to directly. Ordinary pushes to
# master never touch it, so they can never trigger a build. This workflow
# is the only thing that moves it: on a `vX.Y.Z` tag push, it force-pushes
# HEAD (the exact tagged commit) to `docs-deploy`, and that push is what
# Netlify's native branch-deploy detection picks up — no Build Hook or
# secret required.
#
# One-time Netlify dashboard setup (Site configuration -> Build & deploy ->
# Branches and deploy contexts):
#   - Production branch: docs-deploy
#   - Branch deploys: None (so PR/branch previews never build either)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs-deploy-branch:
    name: Point docs-deploy at the release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Force-push tagged commit to docs-deploy
        run: git push origin HEAD:refs/heads/docs-deploy --force