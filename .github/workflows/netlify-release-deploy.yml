name: Deploy docs to Netlify on release

# pycsamt.org previously rebuilt on every push to master via Netlify's
# GitHub App integration, which spends a production-deploy credit per
# commit and exhausted the team's free-plan allowance. Deploys are now
# release-only: this workflow fires solely on `vX.Y.Z` tag pushes and
# tells Netlify (via a Build Hook) to build that exact tag. It is the only
# thing that should trigger a production deploy — the site's automatic
# branch deploys for master must stay disabled in the Netlify dashboard
# (Site configuration -> Build & deploy -> Stop builds).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-netlify:
    name: Trigger Netlify production build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag name
        id: tag
        run: echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Call Netlify build hook
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "::error::NETLIFY_BUILD_HOOK_URL repo secret is not set." >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -d "{\"trigger_branch\": \"${{ steps.tag.outputs.name }}\", \"trigger_title\": \"release ${{ steps.tag.outputs.name }}\"}" \
            "$NETLIFY_BUILD_HOOK_URL"
