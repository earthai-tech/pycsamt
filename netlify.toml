# Netlify configuration for building and hosting the pyCSAMT documentation
# (https://pycsamt.org): Python 3.12, `pip install .[docs,geo]`, Sphinx HTML
# written to docs/build/html.
#
# Netlify's default build timeout is 15 minutes — the cache plugin at the
# bottom persists docs/build (Sphinx environment, doctrees, written html)
# between deploys. docs/source/examples (sphinx-gallery's own per-file
# skip-cache) is deliberately NOT persisted: several example chains write
# shared state to disk outside that directory (e.g. docs/examples/inversion/
# workspaces/, gitignored, not cached) that a later script in the same
# chain reads (plot_4 -> plot_5 -> plot_6). If sphinx-gallery's cache says
# an earlier script is unchanged, it skips re-executing it and that shared
# state never gets recreated in the build's own container -- while a later
# script in the chain, invalidated for an unrelated reason, still runs and
# fails to find it. Every release build therefore re-executes every
# example fresh; if a cold build hits the timeout, deploy once with
# `-D plot_gallery=0` appended to the sphinx command (or ask Netlify
# support to raise the site's timeout), then restore this command.
#
# Release-gated builds: pycsamt.org previously rebuilt on every commit to
# master, which burns a production-deploy credit each time and is what
# exhausted the team's free-plan allowance and suspended the site (see
# HOW-TO-USE-NETLIGY-FOR-OPEN-SOURCE.md, kept local-only, never committed).
# This is now stopped structurally rather than by a dashboard toggle:
#   1. Netlify's production branch (Site configuration -> Build & deploy ->
#      Branches and deploy contexts) is `docs-deploy`, not `master`, with
#      Branch deploys set to None. Master commits never touch that branch,
#      so they can never start a build.
#   2. .github/workflows/netlify-release-deploy.yml force-pushes the exact
#      tagged commit to `docs-deploy` only when a `v*` tag is pushed (i.e.
#      on release) — that push is what Netlify's own GitHub integration
#      detects and builds.
# The `ignore` command below is a cheap second line of defense in case
# `docs-deploy` is ever advanced by some other path: it skips the deploy
# unless HEAD is exactly a `v*` release tag.

[build]
  publish = "docs/build/html"
  # CPU-only torch first: the ai_inversion gallery examples need a DL
  # backend, and the default PyPI torch drags in multi-GB CUDA wheels the
  # build image cannot afford. The cpu index wheel is ~190 MB.
  #
  # No "-j" here: sphinx's own parallel-reading flag executes gallery
  # examples out of order across worker processes -- a separate hazard
  # from sphinx_gallery_conf's "parallel" option (see conf.py), which is
  # already deliberately left disabled for the same reason. The inversion
  # section's plot_4 -> plot_5 -> plot_6 examples share files on disk
  # (each writes what the next reads), so reading must stay serial.
  command = "python -m pip install torch --index-url https://download.pytorch.org/whl/cpu && python -m pip install .[docs,geo] && python -m sphinx -b html docs/source docs/build/html"

  # Build only for release tags. Netlify's clone can be shallow enough to
  # miss tag refs, so fetch them explicitly first; `git describe` then
  # succeeds (exit 0) only when HEAD is exactly tagged `vX.Y.Z...`. Negate
  # it so the overall exit code carries Netlify's expected meaning (0 =
  # skip, non-zero = proceed).
  ignore = "git fetch --tags --quiet 2>/dev/null; ! git describe --tags --exact-match --match 'v*' HEAD >/dev/null 2>&1"

[build.environment]
  # Python runtime on Netlify's build image. Newer (mise-based) images read
  # the .python-version file at the repo root instead; keep both in sync.
  PYTHON_VERSION = "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK = "1"

# Persists the listed directories in Netlify's build cache. The plugin is a
# community package, so it must be declared in package.json (repo root) for
# Netlify's npm step to install it — netlify.toml alone is not enough.
# Trade-off: html removed from the source tree lingers in the cached output
# until a "Clear cache and deploy" — same as any incremental Sphinx build.
[[plugins]]
  package = "netlify-plugin-cache"

  [plugins.inputs]
    paths = [
      "docs/build", # doctrees + environment pickle + written html
    ]
