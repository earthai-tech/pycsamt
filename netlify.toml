# Netlify configuration for building and hosting the pyCSAMT documentation
# (https://pycsamt.org): Python 3.12, `pip install .[docs,geo]`, Sphinx HTML
# written to docs/build/html.
#
# Netlify's default build timeout is 15 minutes — the cache plugin at the
# bottom persists docs/build (Sphinx environment, doctrees, written html)
# *and* docs/source/examples, sphinx-gallery's own generated copy of each
# executed script (thumbnails, notebooks, and the per-file marker it
# compares a fresh script's hash against to decide whether to re-execute
# it). Earlier this directory was deliberately left out of the cache, so
# every build looked "cold" to sphinx-gallery and re-executed every
# example from scratch every time -- fine for one release build, much too
# slow once docs-deploy is pushed to iteratively (see below). Persisting
# it lets sphinx-gallery skip re-executing a script whose source hasn't
# changed since the last successful build, the normal, fast case for a
# docs-only change.
#
# That skip-cache is only trustworthy if a later script's on-disk inputs
# survive too: several example chains write shared state outside
# docs/source/examples (e.g. docs/examples/inversion/workspaces/,
# gitignored) that a later script in the same chain reads
# (plot_4 -> plot_5 -> plot_6). Skipping an earlier script without also
# persisting what it wrote would leave a later, genuinely-invalidated
# script unable to find its input -- so every such directory is listed in
# the cache plugin's paths below too. If a cold/cache-cleared build ever
# hits the timeout regardless, deploy once with `-D plot_gallery=0`
# appended to the sphinx command (or ask Netlify support to raise the
# site's timeout), then restore this command.
#
# Deploy-controlled builds: pycsamt.org previously rebuilt on every commit
# to master, which burns a production-deploy credit each time and is what
# exhausted the team's free-plan allowance and suspended the site (see
# HOW-TO-USE-NETLIGY-FOR-OPEN-SOURCE.md, kept local-only, never committed).
# This is stopped structurally rather than by a dashboard toggle: Netlify's
# production branch (Site configuration -> Build & deploy -> Branches and
# deploy contexts) is `docs-deploy`, not `master`, with Branch deploys set
# to None. Master/v2 commits never touch that branch, so they can never
# start a build by themselves.
#
# `docs-deploy` is deliberately decoupled from the release tag/PyPI cycle
# (python-publish.yml is what tags trigger, on master, independently of
# this file): a docs build should be retriable and iterable without
# implying a new package version. Whoever wants a docs deploy pushes (or
# fast-forward-merges) the ready commit onto `docs-deploy` directly, and
# Netlify's own git integration builds on every new commit to its
# configured production branch -- the default behaviour, so no custom
# `ignore` command is needed here any more. If `docs-deploy` ever needs to
# be resynced with a specific tagged release after the fact, do that with
# an explicit `git push origin <tag>:docs-deploy` rather than reintroducing
# an automatic tag-triggered force-push.

[build]
  publish = "docs/build/html"
  # CPU-only torch first: the ai_inversion gallery examples need a DL
  # backend, and the default PyPI torch drags in multi-GB CUDA wheels the
  # build image cannot afford. The cpu index wheel is ~190 MB.
  #
  # No "-j" here: sphinx's own parallel-reading flag executes gallery
  # examples out of order across worker processes -- a separate hazard
  # from sphinx_gallery_conf's "parallel" option (see conf.py), which is
  # already deliberately left disabled for the same reason. The inversion
  # section's plot_1 -> ... -> plot_11 examples are one sequential l18
  # case-study chain sharing files on disk under
  # docs/examples/inversion/workspaces/ (each script reads what an
  # earlier one wrote), so reading must stay serial.
  #
  # rm -rf below, always run before sphinx: persisting
  # docs/source/examples (sphinx-gallery's own md5-stamped skip-cache,
  # see the cache plugin below) hit a real inconsistency for exactly this
  # chain on 2026-08-20 -- some inversion scripts were restored with a
  # skip-worthy cached md5 while their corresponding
  # docs/examples/inversion/workspaces/ state was not restored alongside
  # it (that gitignored directory had no cache history of its own yet),
  # so a later script in the chain ran for real, found its input missing,
  # and failed. Forcibly clearing both the generated cache and the
  # on-disk workspace for this one section before every build guarantees
  # the whole chain is always self-consistent -- an 11-script re-run is a
  # small, bounded cost, well inside the time budget the pip/docs/build
  # caches free up elsewhere.
  command = "python -m pip install torch --index-url https://download.pytorch.org/whl/cpu && python -m pip install .[docs,geo] && rm -rf docs/source/examples/inversion docs/examples/inversion/workspaces && python -m sphinx -b html docs/source docs/build/html"

[build.environment]
  # Python runtime on Netlify's build image. Newer (mise-based) images read
  # the .python-version file at the repo root instead; keep both in sync.
  PYTHON_VERSION = "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK = "1"
  # Repo-relative (not ~/.cache/pip) so the cache plugin below can persist it
  # without guessing the build image's home directory. Skips re-downloading
  # the CPU torch wheel (~190 MB) and the rest of .[docs,geo] every build.
  PIP_CACHE_DIR = ".cache/pip"

# Persists the listed directories in Netlify's build cache. The plugin is a
# community package, so it must be declared in package.json (repo root) for
# Netlify's npm step to install it — netlify.toml alone is not enough.
# Trade-off: html removed from the source tree lingers in the cached output
# until a "Clear cache and deploy" — same as any incremental Sphinx build.
[[plugins]]
  package = "netlify-plugin-cache"

  [plugins.inputs]
    paths = [
      ".cache/pip", # pip download/wheel cache (PIP_CACHE_DIR above)
      "docs/build", # doctrees + environment pickle + written html
      "docs/source/examples", # sphinx-gallery's own generated/skip-cache copy
      "docs/examples/**/edi_out",
      "docs/examples/**/workspaces",
      "docs/examples/topo/l18_prepared_workspace",
    ]