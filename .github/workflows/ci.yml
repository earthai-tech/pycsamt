name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.test-shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        test-shard: [science, workflows, formats-models, interfaces, support]
        include:
          - test-shard: science
            test-paths: >-
              pycsamt/emtools/tests
              pycsamt/site/tests
              pycsamt/seg/tests
              pycsamt/z/tests
              pycsamt/forward/tests
          - test-shard: workflows
            test-paths: >-
              pycsamt/agents/tests
              pycsamt/assistant
              pycsamt/pipeline/tests
              pycsamt/ai/tests
          - test-shard: formats-models
            test-paths: >-
              pycsamt/api/tests
              pycsamt/models
              pycsamt/inversion/tests
              pycsamt/zonge/tests
              pycsamt/jones/tests
          - test-shard: interfaces
            test-paths: >-
              pycsamt/cli/tests
              pycsamt/app/tests
              pycsamt/app/agent_master/tests
              pycsamt/map/tests
              pycsamt/iot/tests
              pycsamt/tdem/tests
          - test-shard: support
            test-paths: >-
              pycsamt/tests
              pycsamt/core/tests
              pycsamt/compat/tests
              pycsamt/interp/tests
              pycsamt/topo/tests
              pycsamt/transformers/tests
              pycsamt/ts/tests
              pycsamt/stratagem/tests
              pycsamt/utils/tests
              pycsamt/gis/tests
              pycsamt/metadata/tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        if: matrix.test-shard == 'workflows' || matrix.test-shard == 'interfaces'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full]"

      - name: Lint
        run: python -m ruff check pycsamt/map pycsamt/inversion/mt

      # --timeout keeps a single hung test (e.g. an unexpected modal
      # dialog) from stalling the shard until the job-level timeout.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: >
          python -m pytest
          ${{ matrix.test-paths }}
          -m "not live"
          --timeout=300
          --timeout-method=thread
          --cov-append
          --cov=pycsamt
          --cov-branch
          --cov-report=term-missing

      # always() so a shard with test failures still contributes its
      # coverage data; otherwise every package in that shard reads 0%.
      - name: Upload shard coverage artifact
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.test-shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: warn

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: test
    # Run even when a shard is red so the combined report never
    # silently drops packages.
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install coverage tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage[toml]

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: false
          path: coverage-artifacts

      - name: Combine coverage
        run: |
          shopt -s nullglob
          files=(coverage-artifacts/*/.coverage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No coverage data found" >&2
            exit 1
          fi
          python -m coverage combine "${files[@]}"
          python -m coverage report --show-missing
          python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: earthai-tech/pycsamt
          files: ./coverage.xml
          flags: unit
          name: pycsamt-3.12-combined
          disable_search: true
          fail_ci_if_error: false
          verbose: true

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full]"

      - name: Build documentation
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          PYCSAMT_DOCS_BUILD: "1"
        run: python -m sphinx -b html docs/source docs/_build/html

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*
