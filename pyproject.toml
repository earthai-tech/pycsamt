[build-system]
requires      = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata  (PEP 621)
# ---------------------------------------------------------------------------
[project]
name        = "pycsamt"
version     = "2.3.0"
description = "Scientific Python for electromagnetic geophysics — processing, inversion, AI agents, and apps"
readme      = "README.md"
license     = { text = "LGPL-3.0-or-later" }
requires-python = ">=3.9"

authors = [
    { name = "Laurent Kouadio", email = "etanoyau@gmail.com" },
]
maintainers = [
    { name = "Laurent Kouadio", email = "etanoyau@gmail.com" },
]

keywords = [
    "magnetotelluric", "electromagnetic", "geophysics",
    "MT", "AMT", "CSAMT", "CSEM",
    "inversion", "deep-learning", "resistivity",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    # numpy 2.1+ dropped Python 3.9 support, so unconstrained resolution
    # pins 3.9 to numpy 2.0.2 forever -- the first, roughest numpy 2.x
    # release, paired here with matplotlib 3.9.x (the last matplotlib line
    # supporting 3.9). That specific combination segfaults deep inside
    # matplotlib.transforms when a QtAgg canvas is created (CI: "Python 3.9 /
    # interfaces" shard, test_correction_window.py). Python >=3.10 resolves
    # numpy 2.2+ / matplotlib 3.10+ instead and is unaffected, so cap numpy
    # below 2 only on 3.9, where the 1.26.x line is long-proven with these
    # matplotlib/PySide6 versions.
    "numpy>=1.22,<2; python_version < '3.10'",
    "numpy>=1.22; python_version >= '3.10'",
    "scipy>=1.8",
    "matplotlib>=3.5",
    # Shewchuk's Triangle mesh generator (Python bindings): real,
    # quality-graded unstructured triangular FEM meshes
    # (pycsamt.forward.maxwell.tri_mesh_gen) with no compiled external
    # binary required.
    "triangle>=20220202",
    "pandas>=1.4",
    "pyyaml>=5.4",
    "tqdm>=4.60",
    "click>=8.1",
    "rich>=13.0",
    "typing_extensions>=4.1; python_version < '3.10'",
    # pycsamt.compat.sklearn is a hard import for several agents modules
    # (inv2d_agent, inv3d_agent) and other core paths -- not optional.
    "scikit-learn>=1.1",
    # pycsamt.forward.em1d.TEM1DForward delegates its Hankel/Fourier
    # transform to empymod's validated digital linear filters rather than
    # a hand-rolled quadrature (see TEM1DForward's docstring for why).
    # empymod dropped Python 3.9 support in its 2.4 line, so >=2.5 has no
    # installable release there (CI: every 3.9 shard failed at "Install
    # package"). 2.3.1 -- the newest 3.9 has -- exercises the same
    # empymod.bipole() call and passes test_forward_em1d.py unchanged.
    "empymod>=2.3.1; python_version < '3.10'",
    "empymod>=2.5; python_version >= '3.10'",
    # optional HDF5 elevation export/import (pycsamt.map.topo)
    "h5py>=3.8",
]

# ---------------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------------
[project.optional-dependencies]

# AI / ML back-ends (choose one or both)
torch = [
    "torch>=1.13",
]
tensorflow = [
    "tensorflow>=2.10",
]

# Scientific extras
geo = [
    "pyproj>=3.3",
    "xarray>=2022.6",
    "contextily>=1.6",
]

# Development & testing
dev = [
    "pytest>=7.2",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "pre-commit>=3.0",
]

# Documentation build
docs = [
    "sphinx>=7.2",
    "pydata-sphinx-theme>=0.15",
    "numpydoc>=1.7",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-toggleprompt>=0.6",
    "sphinx-design>=0.5",
    "sphinx-gallery>=0.17",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-autobuild>=2024.2",
    # Interactive map gallery (docs/examples/map_3d): Plotly figures are
    # scraped as HTML embeds; Kaleido is used for static image export.
    "plotly>=5.24",
    "kaleido",
    # Legacy .xls TEM coordinate tables (pycsamt.tdem.coordinates), e.g.
    # data/TEMAVG/JIANGSU/"Coordinate of measuring point.xls".
    "xlrd>=2.0",
]

# Desktop application
desktop = [
    "PySide6>=6.9",
    "pyqtgraph>=0.13",
    "contextily>=1.6",
]

# LLM provider clients used by the agent layer.
# anthropic  → Claude (claude-sonnet-4-6, etc.)
# openai     → OpenAI models AND DeepSeek
#              (DeepSeek reuses the openai SDK
#              with a custom base_url)
# google-generativeai → Gemini models
agents = [
    "anthropic>=0.40",
    "openai>=1.54",
    "google-generativeai>=0.8",
]

# Dash web application (legacy pycsamt/app/web)
web = [
    "dash>=2.18",
    "dash-bootstrap-components>=1.6",
    "flask>=3.0",
    "diskcache>=5.6",
    "multiprocess>=0.70",
    "plotly>=5.24",
    "Pillow>=10.0",
]

# Agent Master web application
# Requires Dash 4 + DBC 2 + all LLM providers.
agent-master = [
    "pycsamt[agents]",
    "dash>=4.0",
    "dash-bootstrap-components>=2.0",
    "flask>=3.0",
    "diskcache>=5.6",
    "multiprocess>=0.70",
    "plotly>=5.24",
    "Pillow>=10.0",
]

# Desktop + web application
app = [
    "pycsamt[desktop,web]",
]

# Everything (prefers torch backend)
full = [
    "pycsamt[torch,geo,dev,docs,app,agents]",
]

# ---------------------------------------------------------------------------
# Project URLs
# ---------------------------------------------------------------------------
[project.urls]
Homepage        = "https://github.com/earthai-tech/pycsamt"
Documentation   = "https://pycsamt.org"
"Bug Tracker"   = "https://github.com/earthai-tech/pycsamt/issues"
"Source Code"   = "https://github.com/earthai-tech/pycsamt"
Changelog       = "https://pycsamt.org/changelog.html"

# ---------------------------------------------------------------------------
# Entry points
# ---------------------------------------------------------------------------
[project.scripts]
pycsamt        = "pycsamt.cli:main"
pycsamt-gui    = "pycsamt.app.desktop.__main__:main"
pycsamt-desktop = "pycsamt.app.desktop.__main__:main"
pycsamt-web    = "pycsamt.app.web.__main__:main"
pycsamt-agent  = "pycsamt.app.agent_master.__main__:main"
pycsamt-mapview = "pycsamt.app.mapview.__main__:main"

# ---------------------------------------------------------------------------
# Setuptools configuration
# ---------------------------------------------------------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where   = ["."]
include = ["pycsamt*"]
# Test suites are not needed to install or run the package -- drop them from
# the built distributions (they still live in the repo, which is what CI runs
# against). Keeps the wheel/sdist light.
exclude = ["*.tests", "*.tests.*", "tests", "tests.*"]

[tool.setuptools.package-data]
"pycsamt" = [
    "log/p.configlog.yml",
    "metadata/*.json",
    "metadata/*.yml",
    "gis/*.npy",
    "app/desktop/resources/*.qss",
    "app/desktop/resources/icons/*",
    "app/web/assets/*",
    "app/mapview/assets/*",
    "models/occam2d/_source/*",
    "models/modem/_source/**/*",
    "models/_solver_build/**/*",
    "data/occam2d/*",
    "data/3edis/*.edi",
    "data/inversionFiles/*",
]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.2"
addopts    = "-ra -q --tb=short"
testpaths  = ["pycsamt"]
markers    = [
    "live: tests that require an LLM API key (deselect with -m 'not live')",
    "slow: tests that are deterministic but too slow for the tightest local loop",
    "integration: tests that exercise multiple pycsamt subsystems together",
    "gui: tests that require Qt, Dash, browser, or other UI runtime support",
    "optional_dependency: tests that require an optional dependency group",
    "requires_xarray: tests that require the optional xarray dependency",
    "xdist_group(name): keep tests sharing external state on one xdist worker",
]

[tool.ruff]
line-length = 79
target-version = "py39"
force-exclude = true
exclude = [
    "__pycache__",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "docs/build",
    "scripts",
    "**/tests",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
extend-select = ["E501"]
ignore = ["B008", "E741","B904"]

[tool.ruff.format]
docstring-code-format = true


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# Coverage is configured in .coveragerc (it takes precedence over
# [tool.coverage.*] here, so keep a single source of truth there).
